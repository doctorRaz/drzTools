name: Mega Release

# Mega Release собирает основной продукт существующим release-контрактом и
# добавляет только опубликованные immutable artifacts внешних модулей.
on:
  workflow_dispatch:
  push:
    tags:
      - '*-release*'
      - '*-mandatory*'

permissions:
  contents: write

concurrency:
  group: mega-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_CONFIG_FILE: '.github/release-settings/release.config.json'
  RELEASE_MINIMUM_VERSION_FILE: '.github/release-settings/release-version.txt'
  MANDATORY_MINIMUM_VERSION_FILE: '.github/release-settings/mandatory-version.txt'
  DOTNET_VERSION: '6.0.x'

jobs:
  mega-release:
    name: Build and publish Mega Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}

      - name: Read release configuration
        id: config
        shell: pwsh
        run: ./.github/scripts/Read-ReleaseConfig.ps1

      - name: Validate Mega Release tag
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
              throw "Mega Release must be triggered by a tag, got: $($env:GITHUB_REF_TYPE)"
          }

          $tag = $env:GITHUB_REF_NAME
          $product = $env:PRODUCT

          if ($tag -notlike "${product}_*-release*" -and $tag -notlike "${product}_*-mandatory*") {
              throw "Unsupported Mega Release tag '$tag' for product '$product'."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Calculate release version
        id: version
        shell: pwsh
        env:
          PROJECTS_JSON: ${{ steps.config.outputs.projects_json }}
        run: |
          $projectPaths = $env:PROJECTS_JSON | ConvertFrom-Json
          $versionProject = @($projectPaths)[0]

          $baseVersion = (dotnet msbuild "$versionProject" -getProperty:Version).Trim()
          if ([string]::IsNullOrWhiteSpace($baseVersion)) {
              throw "Version is empty in project: $versionProject"
          }

          try { $parsedBaseVersion = [System.Version]::Parse($baseVersion) }
          catch { throw "Invalid project Version '$baseVersion'. Expected at least Major.Minor." }

          if ($parsedBaseVersion.Build -ge 0 -or $parsedBaseVersion.Revision -ge 0) {
              throw "Project Version must contain only Major.Minor before Build and Revision are appended: $baseVersion"
          }

          $utcNow = [System.DateTime]::UtcNow
          $build = ($utcNow - [System.DateTime]::Parse('2000-01-01')).Days
          $revision = [Math]::Floor($utcNow.TimeOfDay.TotalSeconds / 2)
          $fullVersion = "$baseVersion.$build.$revision"
          [System.Version]::Parse($fullVersion) | Out-Null

          "base_version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "full_version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        env:
          SOLUTION_PATH: ${{ steps.config.outputs.solution_path }}
        run: dotnet restore "$env:SOLUTION_PATH"

      - name: Test
        env:
          SOLUTION_PATH: ${{ steps.config.outputs.solution_path }}
        run: |
          dotnet test "$env:SOLUTION_PATH" `
            --configuration Release `
            --no-restore `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-test-results
          path: TestResults/*.trx
          retention-days: 7

      - name: Publish primary projects
        id: publish
        shell: pwsh
        env:
          PROJECTS_JSON: ${{ steps.config.outputs.projects_json }}
          # Mega intentionally ignores subProjects. They remain in shared config
          # for the ordinary Release workflow.
          SUBPROJECTS_JSON: '[]'
          BUILD: ${{ steps.version.outputs.build }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: ./.github/scripts/Publish-Projects.ps1

      - name: Generate release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/New-ReleaseNotes.ps1

      - name: Stage primary release and immutable modules
        id: stage
        shell: pwsh
        env:
          # Public module releases are read through the workflow token.
          # Private cross-repository access will be handled separately by the GitHub App.
          GH_TOKEN: ${{ github.token }}
          PROJECTS_JSON: ${{ steps.config.outputs.projects_json }}
          PROJECT_TYPES_JSON: ${{ steps.publish.outputs.project_types_json }}
          PRODUCT: ${{ steps.config.outputs.product }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
          RELEASE_CONFIG_FILE: ${{ env.RELEASE_CONFIG_FILE }}
        run: ./.github/scripts/Mega-StageReleaseFiles.ps1

      - name: Determine release type
        id: release_type
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $product = $env:PRODUCT

          if ($tag -like "${product}_*-release*") {
              $mandatory = $false
              $minimumVersionFile = $env:RELEASE_MINIMUM_VERSION_FILE
          }
          elseif ($tag -like "${product}_*-mandatory*") {
              $mandatory = $true
              $minimumVersionFile = $env:MANDATORY_MINIMUM_VERSION_FILE
          }
          else {
              throw "Unsupported release tag: $tag"
          }

          "mandatory=$($mandatory.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "minimum_version_file=$minimumVersionFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read minimum version
        id: minimum_version
        shell: pwsh
        env:
          MINIMUM_VERSION_FILE: ${{ steps.release_type.outputs.minimum_version_file }}
        run: |
          $minimumVersion = $null
          $file = Join-Path $env:GITHUB_WORKSPACE $env:MINIMUM_VERSION_FILE

          if (Test-Path -LiteralPath $file) {
              $text = (Get-Content -LiteralPath $file -Raw).Trim()
              if (-not [string]::IsNullOrWhiteSpace($text)) {
                  try { $parsedVersion = [System.Version]::Parse($text) }
                  catch { throw "Invalid minimum version '$text' in file: $file." }

                  if ($parsedVersion.Revision -lt 0) {
                      throw "Minimum version must contain four components: $text"
                  }

                  $minimumVersion = [ordered]@{
                      major = $parsedVersion.Major
                      minor = $parsedVersion.Minor
                      build = $parsedVersion.Build
                      revision = $parsedVersion.Revision
                  }
              }
          }

          if ($null -eq $minimumVersion) {
              'minimum_version_json=null' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
              "minimum_version_json=$($minimumVersion | ConvertTo-Json -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Create release archives
        id: archives
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
          STAGING_DIRECTORY: ${{ steps.stage.outputs.staging_directory }}
        run: ./.github/scripts/New-ReleaseArchives.ps1

      - name: Create update manifest
        shell: pwsh
        env:
          PRODUCT: ${{ steps.config.outputs.product }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
          MANDATORY: ${{ steps.release_type.outputs.mandatory }}
          MINIMUM_VERSION_JSON: ${{ steps.minimum_version.outputs.minimum_version_json }}
          COMMIT: ${{ github.sha }}
          ARCHIVE_NAME: ${{ steps.archives.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.archives.outputs.archive_sha256 }}
          ARCHIVE_SIZE: ${{ steps.archives.outputs.archive_size }}
          PROTECTED_ARCHIVE_NAME: ${{ steps.archives.outputs.protected_archive_name }}
          PROTECTED_SHA256: ${{ steps.archives.outputs.protected_sha256 }}
          PROTECTED_SIZE: ${{ steps.archives.outputs.protected_size }}
        run: ./.github/scripts/New-UpdateManifest.ps1

      - name: Create Mega Release in current repository
        if: steps.config.outputs.public_here == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ steps.config.outputs.product }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
          ARCHIVE_NAME: ${{ steps.archives.outputs.archive_name }}
          PROTECTED_ARCHIVE_NAME: ${{ steps.archives.outputs.protected_archive_name }}
        run: ./.github/scripts/New-Release.ps1 -Repository $env:GITHUB_REPOSITORY -VerifyTag

      - name: Publish Mega Release to configured repositories
        if: steps.config.outputs.remote_json != '[]'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DOC_PROPS_RELEASE_TOKEN }}
          REMOTE_JSON: ${{ steps.config.outputs.remote_json }}
          PRODUCT: ${{ steps.config.outputs.product }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
          ARCHIVE_NAME: ${{ steps.archives.outputs.archive_name }}
          PROTECTED_ARCHIVE_NAME: ${{ steps.archives.outputs.protected_archive_name }}
        run: |
          $remoteRepos = @($env:REMOTE_JSON | ConvertFrom-Json)

          foreach ($remoteRepo in $remoteRepos) {
              Write-Host "Publishing Mega Release to configured repository: $remoteRepo"
              $env:TARGET_REPO = [string]$remoteRepo
              ./.github/scripts/Publish-PublicRelease.ps1

              if ($LASTEXITCODE -ne 0) {
                  throw "Mega Release publication failed for repository '$remoteRepo'."
              }
          }

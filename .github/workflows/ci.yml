name: CI

# CI проверяет изменения при PR в master и после изменения master.
# Обычные push в рабочие ветки не запускают CI, чтобы не расходовать Actions
# на каждый промежуточный коммит; ручной запуск workflow остаётся доступен.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Позволяет вручную проверить выбранную ветку на её текущем HEAD.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build configuration
        id: config
        shell: pwsh
        run: |
          # Все пути, зависящие от конкретного проекта, берём из общей release-конфигурации.
          $configPath = Join-Path $env:GITHUB_WORKSPACE '.github/release-settings/release.config.json'

          if (-not (Test-Path -LiteralPath $configPath)) {
              throw "Release configuration was not found: $configPath"
          }

          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json

          if ([string]::IsNullOrWhiteSpace($config.solution)) {
              throw "Release configuration property 'solution' is empty."
          }

          $solutionPath = $config.solution
          $solutionFullPath = Join-Path $env:GITHUB_WORKSPACE $solutionPath

          if (-not (Test-Path -LiteralPath $solutionFullPath)) {
              throw "Solution was not found: $solutionPath"
          }

          Write-Host "Solution: $solutionPath"
          "solution_path=$solutionPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      # Восстанавливаем зависимости именно для solution из конфигурации.
      - name: Restore
        env:
          SOLUTION_PATH: ${{ steps.config.outputs.solution_path }}
        run: dotnet restore "$env:SOLUTION_PATH"

      # Собираем ту же solution, которую восстановили на предыдущем шаге.
      - name: Build
        env:
          SOLUTION_PATH: ${{ steps.config.outputs.solution_path }}
        run: dotnet build "$env:SOLUTION_PATH" --configuration Release --no-restore

      # Запускаем тесты для той же solution без повторной сборки.
      - name: Test
        env:
          SOLUTION_PATH: ${{ steps.config.outputs.solution_path }}
        run: dotnet test "$env:SOLUTION_PATH" --configuration Release --no-build --verbosity normal
